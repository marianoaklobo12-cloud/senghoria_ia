name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Construire APK
        run: |
          buildozer android debug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: Senghor_IA_APK
          path: bin/*.apk
