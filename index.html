<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Senghor IA</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>


<img src="logo.svg" class="logo">


<div>

<h1>🤖 Senghor IA</h1>

<p>Studio de création vidéo IA</p>

</div>



<button class="connexion">

</button>


</header>




<section class="create-zone">


<input 
id="prompt"
placeholder="Décris ta vidéo..."
>

</button>

<section class="cards">



<div class="card">

<div class="icon">💬</div>

<br>
Crée tes scénarios
</p>

</div>





<div class="card">

<div class="icon">🎬</div>

<h2>Mes vidéos</h2>

<p>
Voir et lire mes créations
</p>

</div>






<div class="card">

<div class="icon">📁</div>

<p>
Sauvegarder mes histoires
</p>

</div>







<div class="card">

<div class="icon">⚙️</div>

<h2>Paramètres</h2>

<p>
Durée, format, voix robot
</p>

</div>





</section>





<nav>



<button>

🏠

<br>

Accueil

</button>




<button>

✨

<br>

Créer

</button>




<button>

🎬

<br>

Vidéos

</button>




<button>

👤

<br>

Compte

</button>



</nav>




</div>

<script src="app.js"></script>
