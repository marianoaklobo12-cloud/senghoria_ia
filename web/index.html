<!DOCTYPE html>
<html lang="fr">
<head>

<title>Senghor IA</title>

<link rel="manifest" href="manifest.json">

<body>

placeholder="Décris ta vidéo...

</button>
</div>


<div class="bloc">
<h2>⚙️ Paramètres</h2>
<button>
Configuration
</button>
</div>

<nav>

<button>
🏠<br>
Accueil
</button>

✨<br>
Créer
</button>

</button>
