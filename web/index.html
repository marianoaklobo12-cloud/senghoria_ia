<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Senghor IA</title>


<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#00d9ff">


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">


<header>

<img src="logo.svg" class="logo">


<h1>🤖 Senghor IA</h1>


<p>
Studio de création vidéo IA
</p>


<button class="connexion">
🔒 Connexion / Inscription
</button>


</header>




<section class="create-box">


<input 
id="prompt"
placeholder="Décris ta vidéo..."
>


<button class="create">

🎬 Créer une vidéo

</button>


</section>





<section class="cards">



<div class="card">

<div class="icon">🤖</div>

<h2>Assistant IA</h2>

<p>
Créer des scénarios<br>
Discuter avec l'IA
</p>

</div>




<div class="card">

<div class="icon">🎬</div>

<h2>Mes vidéos</h2>

<p>
Voir mes créations
</p>

</div>





<div class="card">

<div class="icon">📁</div>

<h2>Mes projets</h2>

<p>
Sauvegarder mes histoires
</p>

</div>





<div class="card">

<div class="icon">⚙️</div>

<h2>Paramètres</h2>

<p>
Configuration application
</p>

</div>




</section>





<nav>


<button>

🏠

<br>

Accueil

</button>



<button>

✨

<br>

Créer

</button>




<button>

🎬

<br>

Vidéos

</button>




<button>

👤

<br>

Compte

</button>



</nav>



</div>




<script src="app.js"></script>



<script>


// Activation PWA Senghor IA

if ("serviceWorker" in navigator) {


window.addEventListener("load", function(){


navigator.serviceWorker.register("service-worker.js")


.then(function(){


console.log("Senghor IA PWA activée");


})


.catch(function(error){


console.log("Erreur PWA :", error);


});


});


}



</script>



</body>

</html>
